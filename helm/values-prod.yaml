replicaCount: 2

spring:
  profiles:
    active: "prod"

ingress:
  hostname: "api.bpiatek.pl"

env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

vault:
  role: "link-shortener-api-gateway-prod-role"
  secretFiles:
    "secrets.yml":
      secretPath: "kv/data/prod/link-shortener-api-gateway/config"
      secretTemplate: |
        {{- with secret "kv/data/prod/link-shortener-api-gateway/config" -}}
        monitoring:
          user:
            name: {{ .Data.data.monitoring.user.name }}
            password: {{ .Data.data.monitoring.user.password }}
        {{- end -}}